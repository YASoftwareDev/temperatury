name: Lint

# Separate from Tests on purpose. This job needs no data checkout, no chromium
# and no dependencies, so it answers in seconds where the suite takes minutes -
# a linter that reports after the tests would never be read first.
#
# The rule set is in ruff.toml and was chosen by measurement: a rule is enabled
# only if it reported nothing on this codebase, or if what it reported was a
# real defect. That is what lets this job be green from its first run, which is
# the whole point - a check that starts red is a check everyone learns to skip.
#
# The version is pinned. Ruff's default rule set widens between releases (0.16
# already reports rules that were opt-in earlier), so an unpinned install turns
# an unrelated PR red for reasons its author did not introduce.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Shallow AND without data/: nothing in the lint path reads the commit
      # history or a cache file, and checking out 521 MB of committed cache is
      # the slowest thing these jobs do - it once ran past the types job's own
      # 10-minute timeout and cancelled it mid-checkout, on a re-run that then
      # finished in 42 seconds.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/data
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.4

      # --output-format=github turns each finding into a PR annotation on the
      # offending line rather than a line in a log nobody opens.
      - name: Ruff
        run: ruff check --output-format=github .

  # Two passes over the same linter, because half this site's JavaScript never
  # appears in assets/. The per-language runtimes (_page.js, _citybody.js) and
  # every inline <script> are emitted from Python, so a source-only pass reads
  # roughly three quarters of what ships - and reads it wrongly in both
  # directions: it called buildRange unused because its only caller lives in a
  # Python string, and it could not see a dead helper on every landing page.
  #
  # The build is the cheap part: one city, one language, offline, ~4s, and it
  # emits every page shape (city, landing, widget, embed, internal). The
  # extractor deduplicates by content, so this covers the same distinct scripts
  # a full-roster build would.
  js:
    runs-on: ubuntu-latest
    # The only lint job that needs data/ - it builds a city from the committed
    # cache - so it wears the full checkout and needs room for a slow one.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Offline: the committed cache is the source, and CI must never call the
      # upstream API (its shared IP is rate-limited, which is why data/ is
      # committed in the first place).
      - name: Build one city
        env:
          TEMPERATURY_OFFLINE: "1"
          TEMPERATURY_LANGS: en
        run: python main.py --location krakow

      - name: Collect the generated JavaScript
        run: python tools/extract_generated_js.py output .lint-js

      - name: Oxlint
        run: npx --yes oxlint@1.42.0 assets .lint-js

  # The fleet scripts drive the gatherers on machines this repo never sees, so a
  # quoting bug surfaces as missing data days later rather than as a failure
  # here. shellcheck ships on the runner image, so this costs nothing.
  #
  # --severity=warning on purpose: the two remaining notes were read and are
  # correct as written. tools/era5_run.sh counts tool-generated .pkl names with
  # ls (SC2012), and tools/sync-and-gather.sh's `git diff --quiet && git diff
  # --cached --quiet || skip` (SC2015) means exactly what it says - either
  # index dirty, skip.
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/data
          sparse-checkout-cone-mode: false
      - name: Shellcheck
        run: shellcheck --severity=warning tools/*.sh

  # actionlint type-checks the workflows themselves - expressions, contexts,
  # runner labels - and runs shellcheck over every `run:` block, which is how
  # the unquoted clone URL in charts.yml was found.
  #
  # Pinned by version AND checksum: this downloads a binary, and an unpinned
  # release would let an upstream change alter what CI enforces.
  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.7
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/data
          sparse-checkout-cone-mode: false
      - name: Install actionlint
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSLf -o actionlint.tgz "$url"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
      - name: Actionlint
        run: ./actionlint -color

  # mypy in lenient mode: no strict flags, third-party stubs ignored. It reported
  # 17 items over 72 files when first run, few enough to fix rather than
  # suppress, and it caught what no other checker here could - a local list in
  # tools/gen_cities.py rebinding the nested near() helper it shares a scope
  # with, harmless today only because every call happens to run first.
  #
  # NOT strict mode, and not --check-untyped-defs either. Both were measured on
  # this tree rather than argued about:
  #
  #   --strict                941 errors, 684 of them (73%) no-untyped-def and
  #                           no-untyped-call - annotate every function and
  #                           every call target, a whole-codebase project.
  #   --check-untyped-defs     46 errors in 11 files, all read: 12 are
  #                           var-annotated, and the other 34 are the
  #                           `(a, b)[-1]` sequencing idiom in test lambdas,
  #                           re.search(...).group() where a None match is
  #                           already the test's failure, and dict values mypy
  #                           narrowed from their first assignment. No defect
  #                           among them.
  #
  # Enabling either would mean suppressions or annotations for zero found
  # defects, which is what this repo's rule-selection policy exists to refuse.
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/data
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install mypy
        run: pip install mypy==2.3.1
      - name: Mypy
        run: mypy --ignore-missing-imports --explicit-package-bases --exclude '(output|\.venv|\.lint-js)' .
