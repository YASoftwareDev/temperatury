name: Build and deploy site

# Regenerates the charts + page from live Open-Meteo data and publishes the
# result to GitHub Pages. Runs on every push to main, on demand, and yearly
# once the previous calendar year is complete.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 06:00 UTC on 5 January — once the previous calendar year is complete.
    - cron: "0 6 5 1 *"

permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time; a newer push supersedes an in-progress one (this repo
# pushes often — data backfills + iteration — and only the latest matters).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A stuck render fails fast instead of burning the 6h default. 90 rather
    # than 45: the roster enlarged to 32,978 targets (2026-08-22), and render
    # time grows with data coverage - the charts cache keeps warm runs at
    # ~7 min, but a cache-miss cold build at high coverage needs the headroom.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          # The internal data-status page derives its progress series from
          # `git log --diff-filter=A --name-only --no-renames -- data/` (the UTC
          # commit date each cache file was first added on). A depth-1 clone
          # does not merely hide that history: its single grafted commit has no
          # parents, so EVERY file reads as an addition in it. internal.py
          # refuses a shallow checkout for that reason, so without this the tab
          # would deploy with its "no usable commit history" note. Blobless
          # keeps it cheap: the whole commit+tree graph is ~700 objects, while
          # the blobs behind them are ~1 GB of cached series, and the log walk
          # compares trees only (--no-renames, so no rename detection reaches
          # for file contents). Checkout still materialises HEAD's blobs, which
          # is all the build reads.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the previously rendered output/ so main.py only re-renders the
      # cities whose data (or the chart theme version) actually changed — the
      # render is the slow part. A unique key per run always saves a fresh
      # cache; restore-keys pulls the most recent prior one.
      - name: Restore rendered-charts cache
        uses: actions/cache@v4
        with:
          path: |
            output
            payloads
          key: charts-${{ github.run_id }}
          restore-keys: |
            charts-

      # One-time cutover migration (a no-op once steady): a cache from before
      # the payload split holds per-city JSON inside output/charts; move it to
      # payloads/ so the warm cache keeps its value and the main artifact
      # never ships payload files again. Meta files (_*.json, outline.*) stay.
      - name: Migrate cached payloads out of the site artifact
        run: |
          mkdir -p payloads/charts
          find output/charts -maxdepth 1 -name '*.json' \
            ! -name '_*' ! -name 'outline.*' \
            -exec mv -n {} payloads/charts/ \; 2>/dev/null || true

      - name: Generate charts and pages
        run: python main.py --all
        env:
          # Render from the committed cache only; CI's shared IP is
          # rate-limited by Open-Meteo. Refresh the cache locally.
          TEMPERATURY_OFFLINE: "1"
          # Per-city payloads build into payloads/ and are fetched from the
          # temperatury-charts Pages origins (each with its own 1 GB budget) —
          # the main artifact carries everything else. A slug's origin is
          # report.payload_shard of the ORDER of this list; changing the list
          # re-homes every payload on the next run (shard_payloads.py is
          # idempotent over shard dirs).
          TEMPERATURY_PAYLOAD_DIR: payloads/charts
          TEMPERATURY_PAYLOAD_BASE: https://yasoftwaredev.github.io/temperatury-charts/charts/,https://yasoftwaredev.github.io/temperatury-charts-2/charts/

      # Publish the payloads FIRST: if a push fails the job stops and the
      # live site keeps its old, matching payload set — the main site never
      # deploys against payloads that did not land.
      - name: Publish per-city payloads to their shard repos
        env:
          DEPLOY_KEY_0: ${{ secrets.CHARTS_DEPLOY_KEY }}
          DEPLOY_KEY_1: ${{ secrets.CHARTS2_DEPLOY_KEY }}
        run: |
          python tools/shard_payloads.py payloads/charts 2
          mkdir -p ~/.ssh
          REPOS=(temperatury-charts temperatury-charts-2)
          for i in 0 1; do
            key_var="DEPLOY_KEY_$i"
            printf '%s\n' "${!key_var}" > ~/.ssh/charts_key_$i
            chmod 600 ~/.ssh/charts_key_$i
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/charts_key_$i -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            git clone -q --depth 1 --branch gh-pages \
              "git@github.com:YASoftwareDev/${REPOS[$i]}.git" /tmp/charts-repo-$i
            mkdir -p /tmp/charts-repo-$i/charts
            # rsync --delete prunes payloads of cities that left the roster
            # or moved to another shard.
            rsync -a --delete payloads/charts/shard-$i/ /tmp/charts-repo-$i/charts/
            touch /tmp/charts-repo-$i/.nojekyll
            cd /tmp/charts-repo-$i
            git add -A
            if git -c user.email=actions@github.com -c user.name=github-actions \
                 commit -qm "Payloads from ${GITHUB_REPOSITORY}@${GITHUB_SHA::9}"; then
              git push -q origin gh-pages
            else
              echo "shard $i unchanged - nothing to publish"
            fi
            cd "$GITHUB_WORKSPACE"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
